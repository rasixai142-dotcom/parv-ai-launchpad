# Netlify deploy settings for this TanStack Start (Nitro) app.
# Nitro auto-detects Netlify in CI and uses the "netlify" preset, which
# emits static assets to dist/ and the SSR function to .netlify/functions-internal.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NITRO_PRESET = "netlify"
